<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070C0B" />
    <meta name="description" content="GeoChase: ストリートビューで場所を当てる位置推理ゲーム。移動し続ける逃走者を追いかける「逃走モード」も搭載。" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GeoChase" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="GeoChase - 場所当て×追跡ゲーム" />
    <meta property="og:description" content="ストリート画像だけを頼りに場所を推理。移動し続ける逃走者を追いつめよう。" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://adm.shinobi.jp" crossorigin />

    <meta name="google-site-verification" content="oHmE_f6ogd0ZE4WmHBdncsZGod_A0JaotcU5iLCqmXA" />

    <title>GeoChase - 場所当て×追跡ゲーム</title>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <p style="padding: 24px; color: #e6eee9; font-family: sans-serif">
        GeoChaseで遊ぶにはJavaScriptを有効にしてください。
      </p>
    </noscript>

    <!--
      広告は専用HTMLをiframeで読み込む。
      admaxのタグは document.write で中身を書き込むため、SPA本体のHTMLに
      直接置くとReactのマウントやService Workerの介入と競合して描画されないことがある。
      iframeの中の文書は読み込み時に解析されるので document.write が必ず効く。
      スマホは画面最下部の320x50、PCは右下の300x250。
    -->
    <div class="ad-bar">
      <iframe
        class="ad-frame"
        src="/ads/sp.html"
        title="広告"
        width="320"
        height="50"
        scrolling="no"
        loading="eager"
      ></iframe>
    </div>

    <div class="ad-pc">
      <iframe
        class="ad-frame"
        src="/ads/pc.html"
        title="広告"
        width="300"
        height="250"
        scrolling="no"
        loading="eager"
      ></iframe>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
