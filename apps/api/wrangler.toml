name = "geochase-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# --- Durable Object: 1ゲームルーム = 1インスタンス ---
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# --- D1: ユーザー・スコア永続化 ---
[[d1_databases]]
binding = "DB"
database_name = "geochase-db"
database_id = "6c195eb5-8d6b-4702-b951-977ffe751ef8"

# --- KV: セッション/キャッシュ ---
[[kv_namespaces]]
binding = "SESSIONS"
id = "390f220348f446fd9bee7bd6e5734864"

# --- CORS ---
[vars]
ALLOWED_ORIGIN = "https://geochase.pages.dev,http://localhost:5173"
# --- 静的アセット: 自前の線路タイル(電車判定用) ---
[assets]
directory = "./rail-tiles"
binding = "RAIL"
